<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <title>Offline · Englishy</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --text: #111414; --muted: #5d6464; --primary: #0f766e; }
      @media (prefers-color-scheme: dark) { :root { --bg: #131314; --text: #e8eaed; --muted: #a1a6ac; --primary: #2dd4bf; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; padding: 1.5rem; }
      main { max-width: 28rem; text-align: center; }
      a { color: var(--primary); }
      p { color: var(--muted); line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Englishy has not been saved for offline use on this device yet. Connect to the internet once, then lessons, grammar and vocabulary will work offline.</p>
      <p><a href="/">Try again</a></p>
    </main>
  </body>
</html>
