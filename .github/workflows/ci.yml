name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      # Installs the root and frontend dependencies (postinstall runs `npm --prefix frontend ci`).
      - run: npm ci
      - name: Typecheck Worker
        run: npm run typecheck
      - name: Typecheck frontend
        run: npm --prefix frontend run typecheck
      - name: Course content matches the recovered release
        run: npm --prefix frontend run check:data
      - name: Backup merge tests
        run: npm --prefix frontend run test:merge
      - name: Build and bundle the Worker
        run: npx wrangler deploy --dry-run --outdir dist/worker
