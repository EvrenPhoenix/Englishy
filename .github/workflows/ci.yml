name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      # Installs the root and frontend dependencies (postinstall runs `npm --prefix frontend ci`).
      - run: npm ci
      - name: Typecheck Worker
        run: npm run typecheck
      - name: Typecheck frontend
        run: npm --prefix frontend run typecheck
      - name: Course content matches the recovered release
        run: npm --prefix frontend run check:data
      - name: Backup merge tests
        run: npm --prefix frontend run test:merge
      - name: Build and bundle the Worker
        run: npx wrangler deploy --dry-run --outdir dist/worker
